services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://txdxnet.com
    image: txdxnet-web:latest
    container_name: txdxnet-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
